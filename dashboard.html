<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แดชบอร์ดสถิติงานซ่อม - Green Food Factory</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e2e8f0 100%);
            margin: 0; padding: 30px 20px; color: #1e293b; min-height: 100vh; display: flex; justify-content: center;
        }
        .container {
            max-width: 850px; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 35px 30px; border-radius: 24px; box-shadow: 0 15px 35px rgba(15, 23, 42, 0.1); border: 2px solid #bbf7d0; height: fit-content;
        }
        .header-badge { display: inline-block; background: #dcfce7; color: #15803d; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
        h1 { color: #166534; font-size: 26px; margin: 0 0 5px 0; display: flex; align-items: center; gap: 10px; }
        .sub-desc { color: #64748b; font-size: 14px; margin-bottom: 25px; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px;
        }
        .stat-card {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .stat-card.total { border-left: 5px solid #3b82f6; }
        .stat-card.pending { border-left: 5px solid #dc2626; }
        .stat-card.progress { border-left: 5px solid #ca8a04; }
        .stat-card.completed { border-left: 5px solid #16a34a; }

        .stat-number { font-size: 32px; font-weight: bold; color: #1e293b; margin: 10px 0 5px 0; }
        .stat-label { font-size: 14px; font-weight: 600; color: #64748b; }

        .section-box {
            background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 16px; padding: 20px; margin-bottom: 25px;
        }
        .section-title { font-size: 16px; font-weight: bold; color: #166534; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .machine-list { list-style: none; padding: 0; margin: 0; }
        .machine-item { display: flex; justify-content: space-between; padding: 10px 14px; background: white; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        .machine-count { background: #dcfce7; color: #15803d; padding: 2px 10px; border-radius: 20px; font-size: 12px; }

        .btn-group { display: flex; gap: 12px; margin-top: 25px; }
        .btn { flex: 1; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: bold; text-align: center; text-decoration: none; cursor: pointer; border: none; transition: background 0.2s; }
        .btn-primary { background: #22c55e; color: white; }
        .btn-primary:hover { background: #16a34a; }
        .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .btn-secondary:hover { background: #e2e8f0; }
    </style>
</head>
<body>

    <div class="container">
        <span class="header-badge">🥬 GREEN FOOD FACTORY</span>
        <h1>📊 แดชบอร์ดสรุปสถิติงานซ่อมบำรุง</h1>
        <div class="sub-desc">วิเคราะห์ภาพรวมสถานะใบงานและเครื่องจักรที่มีการแจ้งซ่อมบ่อยที่สุด</div>

        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-label">📋 ใบงานทั้งหมด</div>
                <div class="stat-number" id="statTotal">0</div>
            </div>
            <div class="stat-card pending">
                <div class="stat-label">🔴 รอดำเนินการ</div>
                <div class="stat-number" id="statPending">0</div>
            </div>
            <div class="stat-card progress">
                <div class="stat-label">🟡 กำลังซ่อม</div>
                <div class="stat-number" id="statProgress">0</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-label">🟢 ซ่อมเสร็จสิ้น</div>
                <div class="stat-number" id="statCompleted">0</div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">⚙️ สถิติเครื่องจักร/อุปกรณ์ที่แจ้งซ่อมบ่อยที่สุด</div>
            <ul class="machine-list" id="machineStatsList">
                <li style="text-align: center; color: #94a3b8; padding: 15px;">ยังไม่มีข้อมูลในระบบ</li>
            </ul>
        </div>

        <div class="btn-group">
            <a href="history.html" class="btn btn-primary">📋 กลับไปหน้าจัดการประวัติ</a>
            <a href="index.html" class="btn btn-secondary">🏠 หน้าแรก</a>
        </div>
    </div>

    <script>
        function loadDashboard() {
            const tickets = JSON.parse(localStorage.getItem('repairTickets')) || [];
            
            let total = tickets.length;
            let pending = 0;
            let progress = 0;
            let completed = 0;
            let machineCountMap = {};

            tickets.forEach(t => {
                if (t.status.includes('รอดำเนินการ')) pending++;
                else if (t.status.includes('กำลังดำเนินการ')) progress++;
                else if (t.status.includes('เสร็จสิ้น')) completed++;

                let machineName = t.machine.trim();
                if (machineName) {
                    machineCountMap[machineName] = (machineCountMap[machineName] || 0) + 1;
                }
            });

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statPending').innerText = pending;
            document.getElementById('statProgress').innerText = progress;
            document.getElementById('statCompleted').innerText = completed;

            let sortedMachines = Object.entries(machineCountMap).sort((a, b) => b[1] - a[1]);
            let machineListHtml = '';

            if (sortedMachines.length > 0) {
                sortedMachines.forEach(([machine, count]) => {
                    machineListHtml += `
                        <li class="machine-item">
                            <span>⚙️ ${machine}</span>
                            <span class="machine-count">${count} ครั้ง</span>
                        </li>
                    `;
                });
            } else {
                machineListHtml = `<li style="text-align: center; color: #94a3b8; padding: 15px;">ยังไม่มีข้อมูลเครื่องจักร</li>`;
            }

            document.getElementById('machineStatsList').innerHTML = machineListHtml;
        }

        loadDashboard();
    </script>
</body>
</html>
